spring.application.name=jobscan
spring.config.import=optional:file:.env.properties

jobscan.scanner.findwork-api-key=${FINDWORK_API_KEY}
jobscan.scanner.findwork-base-url=https://findwork.dev/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# Empty on AWS, where the JDBC wrapper authenticates with an IAM token
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema; Hibernate only checks the entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cognito access tokens (Bearer). The issuer is the user pool, e.g. https://cognito-idp.<region>.amazonaws.com/<pool id>
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
jobscan.security.cognito-client-id=${COGNITO_SPA_CLIENT_ID}
# Cognito groups become roles, so the `admin` group is ROLE_admin
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=cognito:groups
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
